name: Release (Windows, macOS, Linux)

# Gera os instaladores (assistente Avançar → Concluir) e os pacotes portáteis.
# Com uma tag (git tag vX.Y.Z && git push origin vX.Y.Z) publica em Releases.
# Pela aba Actions (workflow_dispatch) só gera os arquivos, para teste, sem publicar.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex.: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - run: npm install
      - run: npm run build:whisper
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist

  windows-linux:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: launcher/dist
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Windows (.exe com ícone)
        working-directory: launcher
        run: |
          go install github.com/tc-hib/go-winres@latest
          V="${VERSION#v}"
          "$(go env GOPATH)/bin/go-winres" simply --arch amd64 --icon ../public/icons/pwa-512.png --manifest gui \
            --product-name "Lex Audio" --file-description "Lex Audio" --original-filename "Lex Audio.exe" \
            --product-version "$V" --file-version "$V" --copyright "Carlos Alexandre Albuquerque Oliveira"
          mkdir -p out/win
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${VERSION#v}" -o "out/win/Lex Audio.exe" .
          cp packaging/LEIA-ME-Windows.txt out/win/LEIA-ME.txt
          cp ../docs/TERMOS.md ../docs/PRIVACIDADE.md ../docs/MANUAL.md out/win/
          (cd out/win && zip -r ../../../LexAudio-Windows.zip .)
          # termos em .txt com BOM UTF-8 para a tela de licença do instalador
          printf '\xEF\xBB\xBF' > out/win/TERMOS.txt && cat ../docs/TERMOS.md >> out/win/TERMOS.txt

      - name: Linux
        working-directory: launcher
        run: |
          rm -f *.syso
          mkdir -p "out/linux/Lex Audio"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${VERSION#v}" -o "out/linux/Lex Audio/Lex Audio" .
          cp ../public/icons/pwa-512.png "out/linux/Lex Audio/lex-audio.png"
          cp packaging/instalar-atalho.sh "out/linux/Lex Audio/"
          cp packaging/LEIA-ME-Linux.txt "out/linux/Lex Audio/LEIA-ME.txt"
          cp ../docs/TERMOS.md ../docs/PRIVACIDADE.md ../docs/MANUAL.md "out/linux/Lex Audio/"
          tar -czf ../LexAudio-Linux.tar.gz -C out/linux "Lex Audio"

      - name: Linux (.deb — dois cliques abre a Central de Programas)
        working-directory: launcher
        run: |
          V="${VERSION#v}"
          D=out/deb
          mkdir -p $D/DEBIAN $D/opt/lex-audio $D/usr/share/applications $D/usr/share/icons/hicolor/512x512/apps $D/usr/bin
          cp "out/linux/Lex Audio/Lex Audio" $D/opt/lex-audio/lex-audio
          cp ../docs/TERMOS.md ../docs/PRIVACIDADE.md ../docs/MANUAL.md $D/opt/lex-audio/
          cp packaging/linux/lex-audio.desktop $D/usr/share/applications/
          cp ../public/icons/pwa-512.png $D/usr/share/icons/hicolor/512x512/apps/lex-audio.png
          ln -s /opt/lex-audio/lex-audio $D/usr/bin/lex-audio
          sed "s/__VERSION__/$V/" packaging/linux/control > $D/DEBIAN/control
          chmod 755 $D/opt/lex-audio/lex-audio
          dpkg-deb --root-owner-group --build $D ../LexAudio-Linux.deb

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows-linux
          path: |
            LexAudio-Windows.zip
            LexAudio-Linux.tar.gz
            LexAudio-Linux.deb

      - uses: actions/upload-artifact@v4
        with:
          name: win-files
          path: launcher/out/win

  windows-installer:
    needs: windows-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: win-files
          path: launcher/out/win
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Imagens do assistente (BMP) e ícone (ICO)
        working-directory: launcher/packaging/windows
        run: |
          pip install --quiet pillow
          python -c "from PIL import Image; Image.open('wizard.png').convert('RGB').resize((164,314), Image.LANCZOS).save('wizard.bmp'); Image.open('wizard-small.png').convert('RGB').resize((55,55), Image.LANCZOS).save('wizard-small.bmp'); Image.open('../../../public/icons/pwa-512.png').save('lexaudio.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Instalador (Inno Setup)
        working-directory: launcher/packaging/windows
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $v = "$env:VERSION".TrimStart('v')
          & $iscc "/DAppVersion=$v" "/DSourceDir=..\..\out\win" LexAudio.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item ..\..\out\LexAudio-Windows-Instalador.exe ..\..\..\LexAudio-Windows-Instalador.exe

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows-installer
          path: LexAudio-Windows-Instalador.exe

  macos:
    needs: web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: launcher/dist
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Lex Audio.app (Apple Silicon + Intel)
        working-directory: launcher
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${VERSION#v}" -o out/lex-arm64 .
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${VERSION#v}" -o out/lex-amd64 .

          APP="out/mac/Lex Audio.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/LexAudio" out/lex-arm64 out/lex-amd64
          sed "s/__VERSION__/${VERSION#v}/g" packaging/Info.plist > "$APP/Contents/Info.plist"

          ICONSET=out/AppIcon.iconset
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s ../public/icons/pwa-512.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d ../public/icons/pwa-512.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"

          codesign --force --deep --sign - "$APP"
          cp packaging/LEIA-ME-macOS.txt out/mac/LEIA-ME.txt
          cp ../docs/TERMOS.md ../docs/PRIVACIDADE.md ../docs/MANUAL.md out/mac/
          (cd out/mac && ditto -c -k --sequesterRsrc . ../../../LexAudio-macOS.zip)

      - name: Instalador .pkg (Continuar → Instalar → abre o app)
        working-directory: launcher
        run: |
          V="${VERSION#v}"
          mkdir -p out/pkgroot out/scripts out/res
          ditto "out/mac/Lex Audio.app" "out/pkgroot/Lex Audio.app"
          pkgbuild --analyze --root out/pkgroot out/component.plist
          plutil -replace 0.BundleIsRelocatable -bool NO out/component.plist
          cp packaging/macos/postinstall out/scripts/postinstall && chmod +x out/scripts/postinstall
          pkgbuild --root out/pkgroot --component-plist out/component.plist --identifier br.adv.caao.lexaudio \
            --version "$V" --install-location /Applications --scripts out/scripts out/LexAudio-app.pkg
          cp packaging/macos/resources/* out/res/
          sed -i '' "s/__VERSION__/$V/g" out/res/welcome.html
          cp ../docs/TERMOS.md out/res/license.txt
          sed "s/__VERSION__/$V/g" packaging/macos/distribution.xml > out/distribution.xml
          productbuild --distribution out/distribution.xml --resources out/res --package-path out ../LexAudio-macOS-Instalador.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-macos
          path: |
            LexAudio-macOS.zip
            LexAudio-macOS-Instalador.pkg

  release:
    if: github.ref_type == 'tag'
    needs: [windows-linux, windows-installer, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Lex Audio ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            LexAudio-Windows-Instalador.exe
            LexAudio-macOS-Instalador.pkg
            LexAudio-Linux.deb
            LexAudio-Windows.zip
            LexAudio-macOS.zip
            LexAudio-Linux.tar.gz
          body: |
            ## Transforme áudio em texto. Totalmente offline.

            ### Instalar (recomendado): Avançar → Avançar → Concluir
            | Sistema | Baixe e dê dois cliques |
            | --- | --- |
            | Windows 10/11 | **LexAudio-Windows-Instalador.exe** |
            | macOS 11+ (Apple Silicon e Intel) | **LexAudio-macOS-Instalador.pkg** |
            | Linux (Ubuntu, Debian, Mint) | **LexAudio-Linux.deb** |

            Ao final, o Lex Audio abre sozinho e um assistente ajuda a baixar o modelo de IA (uma única vez).
            Depois disso, tudo funciona sem internet.

            **Aviso de segurança na primeira vez:** o programa ainda não tem assinatura digital paga.
            - *Windows:* "O Windows protegeu o computador" → **Mais informações** → **Executar assim mesmo**.
            - *macOS:* se o instalador for bloqueado, abra **Ajustes do Sistema → Privacidade e Segurança** e clique em **Abrir Mesmo Assim**.

            ### Versão portátil (sem instalar)
            **LexAudio-Windows.zip**, **LexAudio-macOS.zip** e **LexAudio-Linux.tar.gz**: extraia e dê dois cliques em **Lex Audio**.
