name: Release (Windows, macOS, Linux)

# Gera os pacotes "baixar e dar dois cliques" e publica em Releases.
# Dispare criando uma tag (git tag v1.0.0 && git push --tags) ou pela aba Actions.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex.: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - run: npm install
      - run: npm run build:whisper
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist

  windows-linux:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: launcher/dist
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Windows (.exe com ícone)
        working-directory: launcher
        run: |
          go install github.com/tc-hib/go-winres@latest
          V="${VERSION#v}"
          "$(go env GOPATH)/bin/go-winres" simply --arch amd64 --icon ../public/icons/pwa-512.png --manifest gui \
            --product-name "Lex Audio" --file-description "Lex Audio" --original-filename "Lex Audio.exe" \
            --product-version "$V" --file-version "$V" --copyright "Carlos Alexandre Albuquerque Oliveira"
          mkdir -p out/win
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui" -o "out/win/Lex Audio.exe" .
          cp packaging/LEIA-ME-Windows.txt out/win/LEIA-ME.txt
          (cd out/win && zip -r ../../../LexAudio-Windows.zip .)

      - name: Linux
        working-directory: launcher
        run: |
          rm -f *.syso
          mkdir -p "out/linux/Lex Audio"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "out/linux/Lex Audio/Lex Audio" .
          cp ../public/icons/pwa-512.png "out/linux/Lex Audio/lex-audio.png"
          cp packaging/instalar-atalho.sh "out/linux/Lex Audio/"
          cp packaging/LEIA-ME-Linux.txt "out/linux/Lex Audio/LEIA-ME.txt"
          tar -czf ../LexAudio-Linux.tar.gz -C out/linux "Lex Audio"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows-linux
          path: |
            LexAudio-Windows.zip
            LexAudio-Linux.tar.gz

  macos:
    needs: web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: launcher/dist
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Lex Audio.app (Apple Silicon + Intel)
        working-directory: launcher
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o out/lex-arm64 .
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o out/lex-amd64 .

          APP="out/mac/Lex Audio.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/LexAudio" out/lex-arm64 out/lex-amd64
          sed "s/__VERSION__/${VERSION#v}/g" packaging/Info.plist > "$APP/Contents/Info.plist"

          ICONSET=out/AppIcon.iconset
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s ../public/icons/pwa-512.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d ../public/icons/pwa-512.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"

          codesign --force --deep --sign - "$APP"
          cp packaging/LEIA-ME-macOS.txt out/mac/LEIA-ME.txt
          (cd out/mac && ditto -c -k --sequesterRsrc . ../../../LexAudio-macOS.zip)

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-macos
          path: LexAudio-macOS.zip

  release:
    needs: [windows-linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Lex Audio ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            LexAudio-Windows.zip
            LexAudio-macOS.zip
            LexAudio-Linux.tar.gz
          body: |
            ## Transforme áudio em texto. Totalmente offline.

            Baixe o arquivo do seu sistema, extraia e dê dois cliques no **Lex Audio**. O app abre no seu navegador.

            | Sistema | Download |
            | --- | --- |
            | Windows 10/11 | **LexAudio-Windows.zip** → `Lex Audio.exe` |
            | macOS 11+ (Apple Silicon e Intel) | **LexAudio-macOS.zip** → `Lex Audio.app` |
            | Linux (x64) | **LexAudio-Linux.tar.gz** → `Lex Audio` |

            Na primeira abertura, baixe um modelo na aba **Modelos**. Depois disso, tudo funciona sem internet.
            Na primeira vez, o Windows e o macOS mostram um aviso de segurança porque o app ainda não tem assinatura digital paga. O LEIA-ME de cada pacote explica como liberar.
