name: Deploy (GitHub Pages)

# Versão online opcional. Ative Settings → Pages → Source: GitHub Actions e rode pela aba Actions.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Instalar dependências
        run: npm install

      - name: Compilar o motor Whisper.cpp (WASM)
        run: npm run build:whisper

      - name: Build da aplicação
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
